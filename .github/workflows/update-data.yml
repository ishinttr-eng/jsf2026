name: 出演者データを自動更新

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公式データを再取得
        run: |
          curl -sS --fail -o tools/raw/performers-data.js \
            "https://jsf-performer-data.morning-salad-c7ab.workers.dev/performers-data.js?v=$(date +%s)"

      - name: アプリ用JSONを再生成
        run: python3 tools/build_data.py

      - name: コミット・プッシュ（確認日時は差分の有無に関わらず必ず更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/venues.json data/performances.json tools/raw/performers-data.js
          if git diff --cached --quiet; then
            DATA_CHANGED=0
          else
            DATA_CHANGED=1
          fi
          git add data/checked.json
          UPDATED_AT=$(python3 -c "import json;print(json.load(open('data/performances.json'))['updatedAt'])")
          if [ "$DATA_CHANGED" = "1" ]; then
            git commit -m "出演者データを自動更新（公式更新: ${UPDATED_AT}）"
          else
            git commit -m "定期チェック（差分なし・公式更新: ${UPDATED_AT}）"
          fi
          git push
