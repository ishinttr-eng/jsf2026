name: 出演者データを自動更新

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公式データを再取得
        run: |
          curl -sS --fail -o tools/raw/performers-data.js \
            "https://jsf-performer-data.morning-salad-c7ab.workers.dev/performers-data.js?v=$(date +%s)"

      - name: アプリ用JSONを再生成
        run: python3 tools/build_data.py

      - name: 差分があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/venues.json data/performances.json tools/raw/performers-data.js
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            UPDATED_AT=$(python3 -c "import json;print(json.load(open('data/performances.json'))['updatedAt'])")
            git commit -m "出演者データを自動更新（公式更新: ${UPDATED_AT}）"
            git push
          fi
